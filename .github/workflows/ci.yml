name: Nucleus CI/CD

on:
  push:
    branches: [main, master, 'claude/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main, master]

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  # ─────────────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit/Widget Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage --reporter=github

      - name: Check coverage threshold (80%)
        run: |
          pip install lcov-cobertura
          python -c "
          import subprocess
          result = subprocess.run(['lcov', '--summary', 'coverage/lcov.info'], capture_output=True, text=True)
          lines = result.stdout + result.stderr
          for line in lines.split('\n'):
              if 'lines' in line.lower():
                  print(line)
                  pct = float(line.split('(')[1].split('%')[0])
                  if pct < 80:
                      raise SystemExit(f'Coverage {pct}% is below 80% threshold')
          "

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────
  build-android:
    name: Build Android (Staging)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle (Staging)
        run: flutter build appbundle --flavor staging -t lib/main.dart --no-pub

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-staging-android
          path: build/app/outputs/bundle/stagingRelease/app-staging-release.aab
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS (Staging)
    runs-on: macos-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --flavor staging -t lib/main.dart --no-pub \
            --no-codesign

      - name: Archive iOS build
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-staging-ios
          path: build/ios/iphoneos/Runner.app
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  deploy-android-staging:
    name: Deploy Android to Firebase App Distribution
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: nucleus-staging-android

      - name: Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID_STAGING }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: app-staging-release.aab
          releaseNotes: |
            Build from ${{ github.ref }}
            Commit: ${{ github.sha }}

  # ─────────────────────────────────────────────────────────────
  deploy-ios-staging:
    name: Deploy iOS to TestFlight
    runs-on: macos-latest
    needs: build-ios
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Deploy to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          flutter pub get
          cd ios && fastlane beta

  # ─────────────────────────────────────────────────────────────
  production-release:
    name: Production Release (on tag)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-ios]
    steps:
      - name: Production release triggered
        run: echo "Production release for ${{ github.ref }}"
      # Full production release handled via Fastlane deliver
