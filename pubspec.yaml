name: nucleus
description: "Nucleus — Voice-first social platform with Orbit dating and Backstage developer ecosystem."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3+1

  # Real-time
  socket_io_client: ^2.0.3+1

  # WebRTC Calls
  flutter_webrtc: ^0.11.2

  # Audio
  flutter_sound: ^9.14.3

  # Animations
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.1
  image_cropper: ^5.0.1
  flutter_image_compress: ^2.3.0

  # Camera
  camera: ^0.10.5+9

  # GIFs
  giphy_get: ^3.2.1

  # Permissions
  permission_handler: ^11.3.1

  # Firebase
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.1
  firebase_analytics: ^10.10.1
  firebase_crashlytics: ^3.5.1
  firebase_remote_config: ^4.4.1

  # Payments
  razorpay_flutter: ^1.3.7
  in_app_purchase: ^3.1.13

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network Status
  connectivity_plus: ^6.0.3

  # File System
  path_provider: ^2.1.3

  # Video
  video_player: ^2.8.7

  # Local Notifications
  flutter_local_notifications: ^17.2.2

  # Internationalisation
  intl: ^0.19.0

  # Utilities
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  infinite_scroll_pagination: ^4.0.0
  pinput: ^4.0.0
  wakelock_plus: ^1.2.8
  local_auth: ^2.3.0
  flutter_contacts: ^1.1.9+1
  screen_recorder: ^0.3.2
  fl_chart: ^0.68.0
  share_plus: ^7.2.2
  package_info_plus: ^7.0.0
  device_info_plus: ^9.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

  # Testing
  mockito: ^5.4.4
  golden_toolkit: ^0.15.0

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/lottie/
    - assets/stickers/
    - assets/images/
    - assets/icons/

  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
